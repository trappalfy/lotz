packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
allowBuilds:
  # native speed-up with a JS fallback
  bigint-buffer: false
  sharp: true
  esbuild: true
  bufferutil: false
  utf-8-validate: false
  keccak: false
  protobufjs: false
  usb: false
  "@solana/wallet-adapter-trezor": false
  # postinstall only prints a message (pulled in by TensorFlow.js)
  core-js: false
